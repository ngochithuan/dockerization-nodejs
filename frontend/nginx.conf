# DNS nội bộ của Docker: tên service "backend" -> IP của TẤT CẢ container backend.
# valid=5s: cứ 5 giây hỏi lại, nên scale lên/xuống không cần khởi động lại Nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

# Load balancer: nhóm các bản sao backend. Mặc định Nginx chia lần lượt (round robin).
upstream backend_pool {
    zone backend_pool 64k;
    # max_fails/fail_timeout: lỗi 1 lần thì tạm bỏ qua bản sao đó trong 10 giây
    server backend:8080 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy + load balancing: mỗi request /api/* được gửi tới MỘT bản sao trong backend_pool.
    location /api/ {
        proxy_pass http://backend_pool;
        # Failover: bản sao không phản hồi trong 2 giây hoặc trả lỗi 502/503/504
        # thì gửi lại request cho bản sao kế tiếp, người dùng không thấy lỗi
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        # Header cho biết bản sao nào đã xử lý request (xem trong DevTools > Network để demo)
        add_header X-Upstream $upstream_addr always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File build của Vite có hash trong tên nên cache lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
