# Docker's internal DNS: the service name "backend" -> the IPs of ALL backend containers.
# valid=5s: re-query every 5 seconds, so scaling up/down needs no Nginx restart.
resolver 127.0.0.11 valid=5s ipv6=off;

# Load balancer: the group of backend replicas. Nginx uses round robin by default.
upstream backend_pool {
    zone backend_pool 64k;
    # max_fails/fail_timeout: after 1 failure, skip that replica for 10 seconds
    server backend:8080 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy + load balancing: each /api/* request is sent to ONE replica in backend_pool.
    location /api/ {
        proxy_pass http://backend_pool;
        # Failover: if a replica does not respond within 2 seconds or returns 502/503/504,
        # retry the request on the next replica so the user sees no error
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        # Header showing which replica handled the request (see DevTools > Network for the demo)
        add_header X-Upstream $upstream_addr always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite build files have a hash in their names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
