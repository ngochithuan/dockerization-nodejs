name: pcshop

# The whole stack starts with a single command:  docker compose up -d
# Then open http://localhost:8080
#
# Secrets that need real values (Google OAuth, Gmail SMTP) are read from the shell / a local
# .env file if present, otherwise the placeholder defaults below are used — the site still
# works without them (Google login is hidden, e-mails are logged instead of sent).

x-app-env: &app-env
  NODE_ENV: production
  BASE_URL: http://localhost:8080
  MONGO_URI: mongodb://mongo:27017/pcshop?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://pcshop:pcshop@rabbitmq:5672
  ELASTICSEARCH_URL: http://elasticsearch:9200
  SEARCH_SERVICE_URL: http://search:4000
  JWT_SECRET: ${JWT_SECRET:-8f3c1e9a7b2d4f6081c5e3a9d7b1f2048e6c3a5d9b7f1e2c}
  JWT_EXPIRES_IN: 7d
  UPLOADS_DIR: /app/uploads
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: http://localhost:8080/api/auth/google/callback
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-PC Shop <no-reply@pcshop.local>}

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/srv/uploads:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  api:
    build: ./services/api
    environment:
      <<: *app-env
      PORT: 3000
    volumes:
      - uploads:/app/uploads
    deploy:
      replicas: 3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification:
    build: ./services/notification
    environment:
      <<: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  search:
    build: ./services/search
    environment:
      <<: *app-env
      PORT: 4000
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/rs-init.js:/scripts/rs-init.js:ro
    healthcheck:
      # Initialises the replica set on first boot, healthy once primary.
      test: ['CMD', 'mongosh', '--quiet', '/scripts/rs-init.js']
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pcshop
      RABBITMQ_DEFAULT_PASS: pcshop
    ports:
      - '${RABBITMQ_UI_PORT:-15672}:15672' # management UI (http://localhost:15672, pcshop/pcshop) — evidence for the microservices bonus
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fs "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  rabbitmq-data:
  es-data:
  uploads:
