# Drink Management App — Level 1 + Level 2
#   Level 1: frontend (React + Nginx) + backend (Node.js/Express) + database (MongoDB)
#   Level 2: 3 bản sao backend + Nginx load balancing,
#            tách service bất đồng bộ qua RabbitMQ (backend publish -> worker consume)
#   Level 3: Docker Swarm, xem deploy/docker-stack.yml
#
# Chạy toàn bộ hệ thống: docker compose up -d
# Ứng dụng web:          http://localhost:3000
# RabbitMQ Management:   http://localhost:15672  (drink / drink123)

name: drink-app

x-mongo-uri: &mongo-uri mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/drink_db?authSource=admin
# Không dùng guest/guest: RabbitMQ chỉ cho tài khoản guest đăng nhập từ localhost (trong container rabbitmq)
x-rabbitmq-url: &rabbitmq-url amqp://${RABBITMQ_USER:-drink}:${RABBITMQ_PASSWORD:-drink123}@rabbitmq:5672

services:
  # ---------- Database ----------
  mongo:
    image: mongo:7.0
    container_name: drink-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Message broker ----------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: drink-rabbitmq
    # RabbitMQ lưu dữ liệu theo tên node (hostname): cố định để queue + tin nhắn còn sau khi tạo lại container
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-drink}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-drink123}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672" # trang quản lý; cổng AMQP 5672 chỉ dùng trong mạng Docker
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - mq-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Seed dữ liệu mẫu (chạy 1 lần rồi thoát) ----------
  seed:
    build: ./backend
    image: drink-app/backend:latest
    container_name: drink-seed
    command: ["node", "seed.js", "--if-empty"]
    environment:
      MONGO_URI: *mongo-uri
    networks:
      - backend-net
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  # ---------- Back-end: Node.js / Express REST API ----------
  # Chạy 3 bản sao giống hệt nhau; Nginx ở service frontend chia request cho chúng (load balancing).
  # Không đặt container_name: tên container phải duy nhất nên sẽ chặn việc scale.
  # Đổi số bản sao khi đang chạy: docker compose up -d --scale backend=5
  backend:
    build: ./backend
    image: drink-app/backend:latest
    restart: unless-stopped
    # Backend chờ 6 giây trước khi tắt (xem server.js), nên cho Docker đợi lâu hơn mặc định 10 giây
    stop_grace_period: 20s
    deploy:
      replicas: 3
    environment:
      PORT: 8080
      MONGO_URI: *mongo-uri
      RABBITMQ_URL: *rabbitmq-url
    expose:
      - "8080"
    networks:
      - frontend-net
      - backend-net
      - mq-net
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # ---------- Worker: Notification service (RabbitMQ consumer) ----------
  # Nhận sự kiện drink.created/updated/deleted từ queue và xử lý bất đồng bộ.
  # 2 bản sao: RabbitMQ chia tin cho từng worker (competing consumers).
  worker:
    build: ./worker
    image: drink-app/worker:latest
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      MONGO_URI: *mongo-uri
      RABBITMQ_URL: *rabbitmq-url
      PROCESS_DELAY_MS: ${WORKER_DELAY_MS:-2000}
    networks:
      - backend-net
      - mq-net
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------- Front-end: React (build) + Nginx reverse proxy / load balancer ----------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: drink-app/frontend:latest
    container_name: drink-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  # Frontend (Nginx) <-> Backend
  frontend-net:
    driver: bridge
  # Backend/Worker <-> MongoDB; internal: không ra Internet, không truy cập được từ frontend
  backend-net:
    driver: bridge
    internal: true
  # Backend/Worker <-> RabbitMQ
  mq-net:
    driver: bridge

volumes:
  mongo-data:
  rabbitmq-data:
