# Web application:        http://localhost:3000
# RabbitMQ Management:    http://localhost:15672  (drink / drink123)

name: drink-app

x-mongo-uri: &mongo-uri mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/drink_db?authSource=admin
# Not guest/guest: RabbitMQ only lets the guest account log in from localhost (inside the rabbitmq container)
x-rabbitmq-url: &rabbitmq-url amqp://${RABBITMQ_USER:-drink}:${RABBITMQ_PASSWORD:-drink123}@rabbitmq:5672

services:
  #  Database
  mongo:
    image: mongo:7.0
    container_name: drink-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-net
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  #  Message broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: drink-rabbitmq
    # RabbitMQ stores data per node name (hostname): keep it fixed so queues + messages survive a recreated container
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-drink}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-drink123}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672" # management UI; AMQP port 5672 is only used inside the Docker network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - mq-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  #  Sample data seeding
  seed:
    build: ./backend
    image: drink-app/backend:latest
    container_name: drink-seed
    command: ["node", "seed.js", "--if-empty"]
    environment:
      MONGO_URI: *mongo-uri
    networks:
      - backend-net
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: drink-app/backend:latest
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      replicas: 3
    environment:
      PORT: 8080
      MONGO_URI: *mongo-uri
      RABBITMQ_URL: *rabbitmq-url
    expose:
      - "8080"
    networks:
      - frontend-net
      - backend-net
      - mq-net
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    build: ./worker
    image: drink-app/worker:latest
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      MONGO_URI: *mongo-uri
      RABBITMQ_URL: *rabbitmq-url
      PROCESS_DELAY_MS: ${WORKER_DELAY_MS:-2000}
    networks:
      - backend-net
      - mq-net
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Front-end: React
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: drink-app/frontend:latest
    container_name: drink-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  # Frontend (Nginx) <-> Backend
  frontend-net:
    driver: bridge
  # Backend/Worker <-> MongoDB; internal: no Internet access, not reachable from the frontend
  backend-net:
    driver: bridge
    internal: true
  # Backend/Worker <-> RabbitMQ
  mq-net:
    driver: bridge

volumes:
  mongo-data:
  rabbitmq-data:
