# Drink Management App — Level 1
# Chạy toàn bộ hệ thống: docker compose up -d
# Mở trình duyệt:        http://localhost:3000

name: drink-app

x-mongo-uri: &mongo-uri mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/drink_db?authSource=admin

services:
  # ---------- Database ----------
  mongo:
    image: mongo:7.0
    container_name: drink-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-net
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: drink-rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672"
    networks:
      - mq-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Seed dữ liệu mẫu (chạy 1 lần rồi thoát) ----------
  seed:
    build: ./backend
    image: drink-app/backend:latest
    container_name: drink-seed
    command: ["node", "seed.js", "--if-empty"]
    environment:
      MONGO_URI: *mongo-uri
    networks:
      - backend-net
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  # ---------- Back-end: Node.js / Express REST API ----------
  # Chạy 3 bản sao giống hệt nhau; Nginx ở service frontend chia request cho chúng (load balancing).
  # Không đặt container_name: tên container phải duy nhất nên sẽ chặn việc scale.
  # Đổi số bản sao khi đang chạy: docker compose up -d --scale backend=5
  backend:
    build: ./backend
    image: drink-app/backend:latest
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      PORT: 8080
      MONGO_URI: *mongo-uri
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

    expose:
      - "8080"
    networks:
      - frontend-net
      - backend-net
      - mq-net
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # ---------- Front-end: React (build) + Nginx reverse proxy ----------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: drink-app/frontend:latest
    container_name: drink-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  # Frontend <-> Backend
  frontend-net:
    driver: bridge
  # Backend <-> MongoDB; internal: không ra Internet, không truy cập được từ frontend
  backend-net:
    driver: bridge
    internal: true
  mq-net:
    driver: bridge

volumes:
  mongo-data:
