worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  log_format lb '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr rt=$request_time';
  access_log /var/log/nginx/access.log lb;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 20m;

  # Docker's embedded DNS. `resolve` below re-reads the A records of the `api` service every
  # few seconds, so replicas added with `--scale api=N` (or removed) are picked up without
  # restarting nginx.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream api_upstream {
    zone api_upstream 64k;
    server api:3000 resolve max_fails=1 fail_timeout=5s;
  }

  upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:80 resolve;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # Shared uploads volume (product images), written by the api replicas.
    location /uploads/ {
      alias /srv/uploads/;
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # Socket.io (websocket transport — no sticky sessions needed; fan-out via Redis adapter).
    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # REST API, round-robin across all api replicas. If one replica is down the request is
    # retried on the next one, so stopping a container is invisible to users.
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 2s;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
