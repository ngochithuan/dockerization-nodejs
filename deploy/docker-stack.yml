# Drink Management App — Level 3: Docker Swarm
#
# Cùng các service như docker-compose.yml, nhưng do Swarm điều phối:
#   - replicas + tự khởi động lại container lỗi (self-healing)
#   - rolling update / rollback từng bản sao, không gián đoạn dịch vụ
#   - routing mesh: cổng 3000 vào được từ mọi node, Swarm chia tải giữa 2 bản sao frontend
#   - giới hạn CPU/RAM cho từng service
#
# Chạy (từ thư mục gốc project):
#   docker compose build                                   # build image drink-app/*
#   docker compose down                                    # giải phóng cổng 3000, 15672
#   docker swarm init
#   docker stack deploy -c deploy/docker-stack.yml drink
#
# Swarm không build image và không hỗ trợ depends_on: các service tự kết nối lại
# cho tới khi MongoDB/RabbitMQ sẵn sàng (backend thoát thì Swarm khởi động lại).

version: "3.8"

x-mongo-uri: &mongo-uri mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017/drink_db?authSource=admin
x-rabbitmq-url: &rabbitmq-url amqp://${RABBITMQ_USER:-drink}:${RABBITMQ_PASSWORD:-drink123}@rabbitmq:5672

services:
  # ---------- Database ----------
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # volume dữ liệu nằm trên node manager
      restart_policy:
        condition: any

  # ---------- Message broker ----------
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-drink}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-drink123}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - mq-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any

  # ---------- Seed dữ liệu mẫu: thử lại tới khi thành công rồi dừng ----------
  seed:
    image: drink-app/backend:latest
    command: ["node", "seed.js", "--if-empty"]
    environment:
      MONGO_URI: *mongo-uri
    networks:
      - backend-net
    # Image backend có HEALTHCHECK gọi /api/health, nhưng seed không chạy web server:
    # tắt đi để Swarm không coi seed là "unhealthy" rồi kill khi đang chờ MongoDB
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure # thoát với mã 0 thì không chạy lại
        delay: 5s
        max_attempts: 20

  # ---------- Back-end: 3 bản sao ----------
  backend:
    image: drink-app/backend:latest
    environment:
      PORT: 8080
      MONGO_URI: *mongo-uri
      RABBITMQ_URL: *rabbitmq-url
    networks:
      - frontend-net
      - backend-net
      - mq-net
    # Backend chờ 6 giây trước khi tắt để Nginx kịp ngừng gửi request (xem server.js)
    stop_grace_period: 20s
    deploy:
      replicas: 3
      # dnsrr: tên "backend" trả về IP của từng bản sao (giống Compose),
      # để Nginx tự chia tải và header X-Upstream vẫn cho biết bản sao nào xử lý
      endpoint_mode: dnsrr
      update_config:
        parallelism: 1 # cập nhật lần lượt từng bản sao
        delay: 10s
        order: start-first # bản mới chạy ổn rồi mới tắt bản cũ
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ---------- Worker: Notification service ----------
  worker:
    image: drink-app/worker:latest
    environment:
      MONGO_URI: *mongo-uri
      RABBITMQ_URL: *rabbitmq-url
      PROCESS_DELAY_MS: 2000
    networks:
      - backend-net
      - mq-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ---------- Front-end: React + Nginx, 2 bản sao sau routing mesh ----------
  frontend:
    image: drink-app/frontend:latest
    ports:
      - "3000:80"
    networks:
      - frontend-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  frontend-net:
    driver: overlay
  backend-net:
    driver: overlay
    internal: true
  mq-net:
    driver: overlay

volumes:
  mongo-data:
  rabbitmq-data:
